# Apache reverse proxy for the colocated NestJS API.
# Target mapping:
#   http://localhost/fengoffice/api/* -> http://127.0.0.1:3000/*
#
# Enable required modules first:
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#   LoadModule headers_module modules/mod_headers.so

ProxyPreserveHost On
ProxyRequests Off

# Helps upstream code understand the original public mount point.
RequestHeader set X-Forwarded-Prefix "/fengoffice/api"

# Reverse proxy the API without adding a second /api prefix upstream.
ProxyPass        "/fengoffice/api/" "http://127.0.0.1:3000/"
ProxyPassReverse "/fengoffice/api/" "http://127.0.0.1:3000/"

# POST / PUT bodies are forwarded automatically by mod_proxy_http.
# Most Apache installs forward Authorization and x-api-key as normal headers.
# If your stack strips Authorization, uncomment the fallback below.
# SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
